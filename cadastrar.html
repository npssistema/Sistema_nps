<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Avaliação</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #1f3c88;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .container {
            width: 700px;
            max-width: calc(100% - 30px);
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        /* 🔥 TOPO */
        .topo-form {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h2 {
            margin: 0;
        }

        /* 🔥 BOTÃO CINZA */
        .btn-imprimir {
            padding: 10px 14px;
            background: #6c757d;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-imprimir:hover {
            background: #5a6268;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            font-size: 13px;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            border: 1px solid #cfcfcf;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .linha3,
        .linha2 {
            display: flex;
            gap: 20px;
        }

        .linha3 div,
        .linha2 div {
            flex: 1;
        }

        .pergunta {
            margin-top: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .notas {
            margin-top: 8px;
        }

        .notas input {
            display: none;
        }

        .notas label {
            display: inline-block;
            border: 1px solid #bfbfbf;
            padding: 6px 10px;
            margin: 2px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
            min-width: 18px;
            text-align: center;
        }

        .notas input:checked + label {
            background: #1f3c88;
            color: white;
            border-color: #1f3c88;
        }

        .btn-salvar {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #007bff;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-voltar {
            display: block;
            margin-top: 15px;
            text-align: center;
            padding: 12px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .linha3,
            .linha2 {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="header">
    Cadastro de Avaliação da Manutenção
</div>

<div class="container">

    <!-- 🔥 TOPO COM BOTÃO -->
    <div class="topo-form">
        <h2>Nova Avaliação</h2>
        <button onclick="imprimirPDF()" class="btn-imprimir">
            Imprimir Formulário
        </button>
    </div>

    <form>

        <label>Nº da OS</label>
        <input type="text">

        <div class="linha3">
            <div><label>Equipamento</label><input type="text"></div>
            <div><label>Marca</label><input type="text"></div>
            <div><label>Modelo</label><input type="text"></div>
        </div>

        <div class="linha2">
            <div><label>Localização</label><input type="text"></div>
            <div><label>Órgão</label><input type="text"></div>
        </div>

        <label>Data</label>
        <input type="date">

        <div class="pergunta">1. Avaliação do serviço</div>
        <div class="notas">
            <input type="radio" name="q1"><label>1</label>
            <input type="radio" name="q1"><label>2</label>
            <input type="radio" name="q1"><label>3</label>
            <input type="radio" name="q1"><label>4</label>
            <input type="radio" name="q1"><label>5</label>
        </div>

        <div class="pergunta">2. Avaliação do técnico</div>
        <div class="notas">
            <input type="radio" name="q2"><label>1</label>
            <input type="radio" name="q2"><label>2</label>
            <input type="radio" name="q2"><label>3</label>
            <input type="radio" name="q2"><label>4</label>
            <input type="radio" name="q2"><label>5</label>
        </div>

        <div class="pergunta">3. Avaliação geral</div>
        <div class="notas">
            <input type="radio" name="q3"><label>1</label>
            <input type="radio" name="q3"><label>2</label>
            <input type="radio" name="q3"><label>3</label>
            <input type="radio" name="q3"><label>4</label>
            <input type="radio" name="q3"><label>5</label>
        </div>

        <label>Comentário</label>
        <textarea></textarea>

        <label>Registrado por</label>
        <input type="text">

        <button class="btn-salvar">Salvar</button>

    </form>

    <a href="index.html" class="btn-voltar">⬅ Voltar para Home</a>

</div>

<script>
function imprimirPDF() {
    window.open("FORMULARIO DE SATISFAÇÃO - ENGENHARIA CLÍNICA.pdf", "_blank");
}
</script>

</body>
</html>
