<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Avaliação</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f4f8;
    margin: 0;
}

.header {
    background: #1f3c88;
    color: white;
    padding: 15px;
    text-align: center;
    font-weight: bold;
}

.container {
    width: 700px;
    max-width: calc(100% - 30px);
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
}

.topo-form {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.btn-imprimir {
    background: #6c757d;
    color: white;
    padding: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
}

input, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
}

.linha3, .linha2 {
    display: flex;
    gap: 10px;
}

.linha3 div, .linha2 div {
    flex: 1;
}

.pergunta {
    margin-top: 20px;
    font-weight: bold;
}

.notas input {
    display: none;
}

.notas label {
    display: inline-block;
    border: 1px solid #ccc;
    padding: 6px 10px;
    margin: 3px;
    cursor: pointer;
}

.notas input:checked + label {
    background: #1f3c88;
    color: white;
}

.btn-salvar {
    margin-top: 20px;
    padding: 12px;
    background: #007bff;
    color: white;
    border: none;
    width: 100%;
}

.btn-voltar {
    display: block;
    margin-top: 15px;
    text-align: center;
    background: #28a745;
    color: white;
    padding: 10px;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="header">
Cadastro de Avaliação da Manutenção
</div>

<div class="container">

<div class="topo-form">
<h2>Nova Avaliação</h2>
<button onclick="imprimirPDF()" class="btn-imprimir">
Imprimir Formulário
</button>
</div>

<form>

<label>Nº da OS</label>
<input type="text">

<div class="linha3">
<div><label>Equipamento</label><input type="text"></div>
<div><label>Marca</label><input type="text"></div>
<div><label>Modelo</label><input type="text"></div>
</div>

<div class="linha2">
<div><label>Localização</label><input type="text"></div>
<div><label>Órgão</label><input type="text"></div>
</div>

<label>Data</label>
<input type="date">

<!-- Q1 -->
<div class="pergunta">1. Avaliação do serviço</div>
<div class="notas">
<input type="radio" id="q1_1" name="q1" value="1"><label for="q1_1">1</label>
<input type="radio" id="q1_2" name="q1" value="2"><label for="q1_2">2</label>
<input type="radio" id="q1_3" name="q1" value="3"><label for="q1_3">3</label>
<input type="radio" id="q1_4" name="q1" value="4"><label for="q1_4">4</label>
<input type="radio" id="q1_5" name="q1" value="5"><label for="q1_5">5</label>
</div>

<!-- Q2 -->
<div class="pergunta">2. Avaliação do técnico</div>
<div class="notas">
<input type="radio" id="q2_1" name="q2" value="1"><label for="q2_1">1</label>
<input type="radio" id="q2_2" name="q2" value="2"><label for="q2_2">2</label>
<input type="radio" id="q2_3" name="q2" value="3"><label for="q2_3">3</label>
<input type="radio" id="q2_4" name="q2" value="4"><label for="q2_4">4</label>
<input type="radio" id="q2_5" name="q2" value="5"><label for="q2_5">5</label>
</div>

<!-- Q3 -->
<div class="pergunta">3. Avaliação geral</div>
<div class="notas">
<input type="radio" id="q3_1" name="q3" value="1"><label for="q3_1">1</label>
<input type="radio" id="q3_2" name="q3" value="2"><label for="q3_2">2</label>
<input type="radio" id="q3_3" name="q3" value="3"><label for="q3_3">3</label>
<input type="radio" id="q3_4" name="q3" value="4"><label for="q3_4">4</label>
<input type="radio" id="q3_5" name="q3" value="5"><label for="q3_5">5</label>
</div>

<label>Comentário</label>
<textarea></textarea>

<label>Registrado por</label>
<input type="text">

<button class="btn-salvar">Salvar</button>

</form>

<a href="index.html" class="btn-voltar">⬅ Voltar para Home</a>

</div>

<script>
function imprimirPDF() {
    window.open("FORMULARIO DE SATISFAÇÃO - ENGENHARIA CLÍNICA.pdf", "_blank");
}
</script>

</body>
</html>
