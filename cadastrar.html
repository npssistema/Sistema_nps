<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Avaliação</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f4f8;
    margin: 0;
    padding: 0;
}

.header {
    background: #1f3c88;
    color: white;
    padding: 18px 12px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.3;
}

.container {
    width: 700px;
    max-width: calc(100% - 20px);
    margin: 25px auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 12px rgba(0,0,0,0.1);
}

.topo-form {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

h2 {
    margin: 0;
    font-size: 22px;
}

.btn-imprimir {
    padding: 10px 12px;
    background: #6c757d;
    color: white;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
    font-size: 13px;
}

input,
textarea {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    font-size: 14px;
}

textarea {
    min-height: 100px;
}

.linha3,
.linha2 {
    display: flex;
    gap: 15px;
}

.linha3 div,
.linha2 div {
    flex: 1;
}

.pergunta {
    margin-top: 20px;
    font-weight: bold;
    font-size: 14px;
}

.notas {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.notas input {
    position: absolute;
    opacity: 0;
}

.notas label {
    border: 1px solid #bfbfbf;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 6px;
    font-weight: bold;
    min-width: 30px;
    text-align: center;
}

.notas input:checked + label {
    background: #1f3c88;
    color: white;
    border-color: #1f3c88;
}

.btn-salvar {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    background: #007bff;
    color: white;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
}

.btn-voltar {
    display: block;
    margin-top: 15px;
    text-align: center;
    padding: 12px;
    background: #28a745;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}

.mensagem {
    margin-top: 15px;
    padding: 12px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
}

.mensagem.sucesso {
    display: block;
    background: #d4edda;
    color: #155724;
}

.mensagem.erro {
    display: block;
    background: #f8d7da;
    color: #721c24;
}

/* 🔥 RESPONSIVIDADE */
@media (max-width: 700px) {

    .container {
        padding: 18px;
        margin: 15px auto;
    }

    .linha3,
    .linha2 {
        flex-direction: column;
        gap: 0;
    }

    .header {
        font-size: 18px;
    }

    h2 {
        font-size: 20px;
    }

    .btn-imprimir {
        width: 100%;
        text-align: center;
    }

    .notas {
        justify-content: space-between;
    }

    .notas label {
        flex: 1;
    }
}

@media (max-width: 420px) {

    .container {
        padding: 15px;
    }

    .header {
        font-size: 16px;
    }

    h2 {
        font-size: 18px;
    }

    input, textarea {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="header">
Cadastro de Avaliação da Manutenção
</div>

<div class="container">

<div class="topo-form">
<h2>Nova Avaliação</h2>
<button onclick="imprimirPDF()" class="btn-imprimir" type="button">
Formulário
</button>
</div>

<form id="form-avaliacao">

<label>Nº da OS</label>
<input type="text" name="os_numero" required>

<div class="linha3">
<div><label>Equipamento</label><input type="text" name="equipamento" required></div>
<div><label>Marca</label><input type="text" name="marca" required></div>
<div><label>Modelo</label><input type="text" name="modelo" required></div>
</div>

<div class="linha2">
<div><label>Localização</label><input type="text" name="localizacao" required></div>
<div><label>Órgão</label><input type="text" name="orgao" required></div>
</div>

<label>Data</label>
<input type="date" name="data" required>

<div class="pergunta">1. Avaliação do serviço</div>
<div class="notas">
<input type="radio" name="q1" value="1" required><label>1</label>
<input type="radio" name="q1" value="2"><label>2</label>
<input type="radio" name="q1" value="3"><label>3</label>
<input type="radio" name="q1" value="4"><label>4</label>
<input type="radio" name="q1" value="5"><label>5</label>
</div>

<div class="pergunta">2. Avaliação do técnico</div>
<div class="notas">
<input type="radio" name="q2" value="1" required><label>1</label>
<input type="radio" name="q2" value="2"><label>2</label>
<input type="radio" name="q2" value="3"><label>3</label>
<input type="radio" name="q2" value="4"><label>4</label>
<input type="radio" name="q2" value="5"><label>5</label>
</div>

<div class="pergunta">3. Avaliação geral</div>
<div class="notas">
<input type="radio" name="q3" value="1" required><label>1</label>
<input type="radio" name="q3" value="2"><label>2</label>
<input type="radio" name="q3" value="3"><label>3</label>
<input type="radio" name="q3" value="4"><label>4</label>
<input type="radio" name="q3" value="5"><label>5</label>
</div>

<label>Comentário</label>
<textarea name="comentario"></textarea>

<label>Registrado por</label>
<input type="text" name="registrado_por" required>

<div id="mensagem" class="mensagem"></div>

<button class="btn-salvar">Salvar</button>

</form>

<a href="index.html" class="btn-voltar">⬅ Voltar para Home</a>

</div>

<script>
function imprimirPDF() {
    window.open("FORMULARIO DE SATISFAÇÃO - ENGENHARIA CLÍNICA.pdf", "_blank");
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/cadastrar.js"></script>

</body>
</html>
