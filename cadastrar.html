<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Avaliação</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f4f8;
    margin: 0;
    padding: 0;
}

.header {
    background: #1f3c88;
    color: white;
    padding: 18px 12px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.3;
}

.container {
    width: 700px;
    max-width: calc(100% - 20px);
    margin: 25px auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 12px rgba(0,0,0,0.1);
}

.topo-form {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

h2 {
    margin: 0;
    font-size: 22px;
}

.btn-imprimir {
    padding: 10px 12px;
    background: #6c757d;
    color: white;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
    font-size: 13px;
}

input,
textarea {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    font-size: 14px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.linha3,
.linha2 {
    display: flex;
    gap: 15px;
}

.linha3 div,
.linha2 div {
    flex: 1;
}

.pergunta {
    margin-top: 20px;
    font-weight: bold;
    font-size: 14px;
}

.notas {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.notas input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.notas label {
    border: 1px solid #bfbfbf;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 6px;
    font-weight: bold;
    min-width: 32px;
    text-align: center;
    margin-top: 0;
}

.notas input:checked + label {
    background: #1f3c88;
    color: white;
    border-color: #1f3c88;
}

.btn-salvar {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    background: #007bff;
    color: white;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
}

.btn-salvar:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.btn-voltar {
    display: block;
    margin-top: 15px;
    text-align: center;
    padding: 12px;
    background: #28a745;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}

.mensagem {
    margin-top: 15px;
    padding: 12px;
    border-radius: 6px;
    font-size: 14px;
    display: none;
}

.mensagem.sucesso {
    display: block;
    background: #d4edda;
    color: #155724;
}

.mensagem.erro {
    display: block;
    background: #f8d7da;
    color: #721c24;
}

@media (max-width: 700px) {
    .container {
        padding: 18px;
        margin: 15px auto;
    }

    .linha3,
    .linha2 {
        flex-direction: column;
        gap: 0;
    }

    .header {
        font-size: 18px;
    }

    h2 {
        font-size: 20px;
    }

    .btn-imprimir {
        width: 100%;
    }

    .notas {
        justify-content: space-between;
    }

    .notas label {
        flex: 1;
    }
}

@media (max-width: 420px) {
    .container {
        padding: 15px;
    }

    .header {
        font-size: 16px;
    }

    h2 {
        font-size: 18px;
    }

    input,
    textarea {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="header">
    Cadastro de Avaliação da Manutenção
</div>

<div class="container">

    <div class="topo-form">
        <h2>Nova Avaliação</h2>
        <button onclick="imprimirPDF()" class="btn-imprimir" type="button" id="btnImprimir">
            Formulário
        </button>
    </div>

    <form id="form-avaliacao">

        <label for="os_numero">Nº da OS</label>
        <input type="text" id="os_numero" name="os_numero" required autocomplete="off">

        <div class="linha3">
            <div>
                <label for="equipamento">Equipamento</label>
                <input type="text" id="equipamento" name="equipamento" required autocomplete="off">
            </div>

            <div>
                <label for="marca">Marca</label>
                <input type="text" id="marca" name="marca" required autocomplete="off">
            </div>

            <div>
                <label for="modelo">Modelo</label>
                <input type="text" id="modelo" name="modelo" required autocomplete="off">
            </div>
        </div>

        <div class="linha2">
            <div>
                <label for="localizacao">Localização</label>
                <input type="text" id="localizacao" name="localizacao" required autocomplete="off">
            </div>

            <div>
                <label for="orgao">Órgão</label>
                <input type="text" id="orgao" name="orgao" required autocomplete="off">
            </div>
        </div>

        <label for="data">Data</label>
        <input type="date" id="data" name="data" required autocomplete="off">

        <div class="pergunta">1. Avaliação do serviço</div>
        <div class="notas">
            <input type="radio" id="q1_1" name="q1" value="1" required><label for="q1_1">1</label>
            <input type="radio" id="q1_2" name="q1" value="2"><label for="q1_2">2</label>
            <input type="radio" id="q1_3" name="q1" value="3"><label for="q1_3">3</label>
            <input type="radio" id="q1_4" name="q1" value="4"><label for="q1_4">4</label>
            <input type="radio" id="q1_5" name="q1" value="5"><label for="q1_5">5</label>
        </div>

        <div class="pergunta">2. Avaliação do técnico</div>
        <div class="notas">
            <input type="radio" id="q2_1" name="q2" value="1" required><label for="q2_1">1</label>
            <input type="radio" id="q2_2" name="q2" value="2"><label for="q2_2">2</label>
            <input type="radio" id="q2_3" name="q2" value="3"><label for="q2_3">3</label>
            <input type="radio" id="q2_4" name="q2" value="4"><label for="q2_4">4</label>
            <input type="radio" id="q2_5" name="q2" value="5"><label for="q2_5">5</label>
        </div>

        <div class="pergunta">3. Avaliação geral</div>
        <div class="notas">
            <input type="radio" id="q3_1" name="q3" value="1" required><label for="q3_1">1</label>
            <input type="radio" id="q3_2" name="q3" value="2"><label for="q3_2">2</label>
            <input type="radio" id="q3_3" name="q3" value="3"><label for="q3_3">3</label>
            <input type="radio" id="q3_4" name="q3" value="4"><label for="q3_4">4</label>
            <input type="radio" id="q3_5" name="q3" value="5"><label for="q3_5">5</label>
        </div>

        <label for="comentario">Comentário</label>
        <textarea id="comentario" name="comentario" autocomplete="off"></textarea>

        <label for="registrado_por">Registrado por</label>
        <input type="text" id="registrado_por" name="registrado_por" required autocomplete="off">

        <div id="mensagem" class="mensagem"></div>

        <button id="btnSalvar" class="btn-salvar" type="submit">
            Salvar
        </button>

    </form>

    <a href="index.html" class="btn-voltar">⬅ Voltar para Home</a>

</div>

<script>
function imprimirPDF() {
    window.open("FORMULARIO DE SATISFAÇÃO - ENGENHARIA CLÍNICA.pdf", "_blank");
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/cadastrar.js"></script>

</body>
</html>
