<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Avaliações</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #1f3c88;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        }

        .container {
            max-width: 1280px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.1);
        }

        .filtro-box {
            background: #f8faff;
            border: 1px solid #dbe3f3;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 30px;
        }

        .filtro-title {
            font-size: 16px;
            font-weight: bold;
            color: #1f3c88;
            margin-bottom: 15px;
        }

        .filtro {
            display: grid;
            grid-template-columns: repeat(4, 1fr) 220px;
            gap: 16px;
            align-items: stretch;
        }

        .campo {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            height: 44px;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #cfcfcf;
            border-radius: 10px;
            outline: none;
            background: white;
            appearance: none;
            -webkit-appearance: none;
            line-height: normal;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.7;
        }

        input:focus {
            border-color: #1f3c88;
            box-shadow: 0 0 6px rgba(31, 60, 136, 0.25);
        }

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .btn {
            height: 44px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
        }

        .btn-filtrar {
            background: #007bff;
            color: white;
        }

        .btn-limpar {
            background: #6c757d;
            color: white;
        }

        .btn-voltar {
            background: #28a745;
            color: white;
            margin-top: 30px;
            width: 100%;
            height: 45px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-excluir {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            min-width: 90px;
        }

        .btn-excluir:hover,
        .btn:hover,
        .btn-voltar:hover {
            opacity: 0.92;
        }

        .filtro-classificacao {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .btn-classificacao {
            padding: 10px 16px;
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            color: #222;
            display: inline-block;
            transition: 0.2s;
            background: white;
        }

        .btn-classificacao:hover {
            transform: translateY(-1px);
        }

        .btn-promotor {
            background: #d4edda;
            border-color: #b7dfc2;
        }

        .btn-neutro {
            background: #fff3cd;
            border-color: #f0df9d;
        }

        .btn-detrator {
            background: #f8d7da;
            border-color: #e8b8be;
        }

        .btn-todos {
            background: #e2e3e5;
            border-color: #cfd2d6;
        }

        .ativo {
            box-shadow: 0 0 0 2px rgba(31, 60, 136, 0.18);
        }

        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            min-width: 1400px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            font-size: 14px;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
        }

        th {
            background: #1f3c88;
            color: white;
        }

        tr:hover {
            filter: brightness(0.98);
        }

        .linha-promotor {
            background: #d4edda;
        }

        .linha-neutro {
            background: #fff3cd;
        }

        .linha-detrator {
            background: #f8d7da;
        }

        .comentario-coluna {
            max-width: 240px;
            white-space: normal;
            word-break: break-word;
        }

        .classificacao-badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-promotor {
            background: #c3e6cb;
            color: #155724;
        }

        .badge-neutro {
            background: #ffe8a1;
            color: #856404;
        }

        .badge-detrator {
            background: #f5c6cb;
            color: #721c24;
        }

        .status-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }

        .status-erro {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #e8b8be;
        }

        .status-info {
            display: block;
            background: #e7f3ff;
            color: #084298;
            border: 1px solid #b6d4fe;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            animation: aparecerModal 0.2s ease;
        }

        .modal-header {
            background: #dc3545;
            color: white;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .modal-body {
            padding: 24px 20px 10px 20px;
            text-align: center;
            color: #333;
            font-size: 15px;
            line-height: 1.5;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            padding: 20px;
        }

        .modal-btn {
            flex: 1;
            height: 44px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .modal-btn-confirmar {
            background: #dc3545;
            color: white;
        }

        .modal-btn-cancelar {
            background: #6c757d;
            color: white;
        }

        .modal-btn:hover {
            opacity: 0.92;
        }

        @keyframes aparecerModal {
            from {
                transform: scale(0.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 1100px) {
            .filtro {
                grid-template-columns: repeat(2, 1fr);
            }

            .botoes {
                grid-column: span 2;
                flex-direction: row;
            }
        }

        @media (max-width: 700px) {
            .container {
                padding: 15px;
            }

            .filtro {
                grid-template-columns: 1fr;
            }

            .botoes {
                flex-direction: column;
            }

            .modal-footer {
                flex-direction: column;
            }

            .filtro-classificacao {
                flex-direction: column;
            }

            .btn-classificacao {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="header">
    📄 Histórico de Avaliações
</div>

<div class="container">

    <div class="filtro-box">
        <div class="filtro-title">🔍 Filtros de Pesquisa</div>

        <form id="form-filtros">
            <div class="filtro">

                <div class="campo">
                    <label for="filtro_os">Número da OS</label>
                    <input type="text" id="filtro_os" name="os">
                </div>

                <div class="campo">
                    <label for="filtro_data_inicio">Data inicial</label>
                    <input type="date" id="filtro_data_inicio" name="data_inicio">
                </div>

                <div class="campo">
                    <label for="filtro_data_fim">Data final</label>
                    <input type="date" id="filtro_data_fim" name="data_fim">
                </div>

                <div class="campo">
                    <label for="filtro_equipamento">Equipamento</label>
                    <input type="text" id="filtro_equipamento" name="equipamento">
                </div>

                <div class="campo">
                    <label for="filtro_marca">Marca</label>
                    <input type="text" id="filtro_marca" name="marca">
                </div>

                <div class="campo">
                    <label for="filtro_modelo">Modelo</label>
                    <input type="text" id="filtro_modelo" name="modelo">
                </div>

                <div class="campo">
                    <label for="filtro_localizacao">Localização</label>
                    <input type="text" id="filtro_localizacao" name="localizacao">
                </div>

                <div class="campo">
                    <label for="filtro_orgao">Órgão</label>
                    <input type="text" id="filtro_orgao" name="orgao">
                </div>

                <div class="botoes">
                    <button type="submit" class="btn btn-filtrar">🔍 Filtrar</button>
                    <button type="button" class="btn btn-limpar" id="btn-limpar">🧹 Limpar</button>
                </div>
            </div>

            <div class="filtro-classificacao">
                <button type="button" class="btn-classificacao btn-todos ativo" data-classificacao="">
                    Todos
                </button>

                <button type="button" class="btn-classificacao btn-promotor" data-classificacao="promotor">
                    Promotores
                </button>

                <button type="button" class="btn-classificacao btn-neutro" data-classificacao="neutro">
                    Neutros
                </button>

                <button type="button" class="btn-classificacao btn-detrator" data-classificacao="detrator">
                    Detratores
                </button>
            </div>
        </form>

        <div id="status-box" class="status-box"></div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>OS</th>
                    <th>Equipamento</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Localização</th>
                    <th>Órgão</th>
                    <th>Data</th>
                    <th>P1</th>
                    <th>P2</th>
                    <th>P3</th>
                    <th>Comentário</th>
                    <th>Registrado por</th>
                    <th>Classificação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-avaliacoes">
                <tr>
                    <td colspan="15">Carregando avaliações...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <a href="index.html" class="btn-voltar">⬅ Voltar para Home</a>

</div>

<div id="modalExcluir" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            ⚠ Confirmar Exclusão
        </div>

        <div class="modal-body">
            Tem certeza que gostaria de excluir essa avaliação?
        </div>

        <div class="modal-footer">
            <button type="button" class="modal-btn modal-btn-confirmar" id="confirmarExclusao">
                Sim
            </button>
            <button type="button" class="modal-btn modal-btn-cancelar" id="cancelarExclusao">
                Não
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/historico.js"></script>

</body>
</html>
